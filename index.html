<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Hofverkauf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Hofverkauf">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F1EA">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-dark:#0F1711; --ink-dark-2:#1B241C; --ink-dark-3:#28332A;
    --bg:#F1F4EF; --panel:#FFFFFF; --panel-2:#E8ECE5;
    --border:#DBE1D8; --border-soft:#E7EBE3;
    --ink:#141B15; --sub:#5B655C; --sub-2:#828C81;
    --accent:#1C9A47; --accent-dark:#13793A; --accent-light:#7AC142; --accent-soft:#E1F5E5;
    --slate:#3F4C43; --slate-soft:#EEF2EE;
    --green:#1C9A47; --orange:#DB7F1F; --red:#DD4C46;
    --shadow-sm: 0 1px 2px rgba(10,20,10,0.05), 0 1px 1px rgba(10,20,10,0.04);
    --shadow-md: 0 4px 16px rgba(10,20,10,0.08), 0 1px 3px rgba(10,20,10,0.05);
    --radius-lg: 16px; --radius-md: 12px; --radius-sm: 9px; --radius-pill: 999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .app-shell{display:flex;min-height:calc(100vh - 58px);}
  .sidebar{width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:58px;height:calc(100vh - 58px);transition:width .18s ease;z-index:15;}
  .sidebar.collapsed{width:60px;}
  .sidebar-toggle{background:none;border:none;cursor:pointer;color:var(--sub-2);padding:16px 18px;display:flex;align-items:center;justify-content:flex-start;transition:transform .18s;}
  .sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg);}
  .sidebar-toggle:hover{color:var(--ink);}
  .sidebar nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px;overflow-y:auto;}
  .sidebar nav button{display:flex;align-items:center;gap:12px;background:none;border:none;padding:10px 11px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;border-radius:var(--radius-sm);white-space:nowrap;text-align:left;width:100%;transition:background .15s,color .15s;}
  .sidebar nav button svg{flex-shrink:0;width:20px;height:20px;}
  .sidebar nav button:hover{background:var(--panel-2);color:var(--ink);}
  .sidebar nav button.active{background:#1F2A24;color:#fff;}
  .sidebar.collapsed nav button{justify-content:center;padding:11px;}
  .sidebar.collapsed nav button .navlabel{display:none;}
  .sidebar.collapsed{align-items:center;}
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  header{
    background:
      linear-gradient(180deg, rgba(31,42,36,0.94), rgba(31,42,36,0.97)),
      url('header-bg.jpg') center 60%/cover no-repeat;
    color:#fff;padding:13px 20px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:20;
    border-bottom:1px solid #000;
  }
  header .logo-img{height:32px;width:auto;display:block;filter:none;}
  header .logo-fallback{width:32px;height:32px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:12px;}
  header h1{font-size:16.5px;margin:0;font-weight:800;letter-spacing:-0.01em;color:#fff;}
  header .header-animalpick{flex:1;display:flex;justify-content:center;}
  header .header-animalpick select{width:auto;min-width:190px;max-width:280px;font-weight:600;}
  header .save{font-size:11px;display:flex;align-items:center;gap:6px;color:#C9D1CC;white-space:nowrap;background:rgba(255,255,255,0.08);padding:4px 9px;border-radius:var(--radius-pill);}
  .dotstate{width:7px;height:7px;border-radius:50%;background:var(--sub-2);flex-shrink:0;}
  .dotstate.ok{background:var(--accent);} .dotstate.busy{background:var(--orange);} .dotstate.err{background:var(--red);}
  .refresh-btn{background:none;border:none;cursor:pointer;color:#C9D1CC;padding:2px;display:flex;align-items:center;transition:color .15s,transform .3s;}
  .refresh-btn:hover{color:#fff;transform:rotate(90deg);}
  main{max-width:1400px;margin:0 auto;padding:22px 20px 60px;width:100%;}
  @media (max-width:820px){
    .sidebar{position:fixed;left:0;top:58px;bottom:0;width:60px;}
    .sidebar.expanded-mobile{width:210px;}
    .sidebar.expanded-mobile nav button .navlabel{display:inline;}
    .sidebar nav button .navlabel{display:none;}
    .main-col{margin-left:60px;}
    header .header-animalpick select{min-width:140px;}
  }
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  h2{font-size:16px;margin:0 0 14px;color:var(--ink);font-weight:800;letter-spacing:-0.015em;}
  h3{font-size:12px;margin:0 0 8px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  label{font-size:11.5px;color:var(--sub);display:block;margin-bottom:4px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    border:1.5px solid var(--border);background:var(--panel);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;color:var(--ink);width:100%;font-family:inherit;transition:border-color .15s, box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  textarea{resize:vertical;min-height:32px;}
  .btn{border:none;border-radius:var(--radius-sm);padding:8px 15px;font-size:13px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s, transform .1s, filter .15s;}
  .btn:active{transform:scale(0.96);}
  .btn-navy{background:var(--accent);color:#fff;}
  .btn-navy:hover{filter:brightness(1.08);}
  .btn-blue{background:var(--slate);color:#fff;}
  .btn-blue:hover{filter:brightness(1.3);}
  .btn-green{background:var(--accent);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:var(--panel);color:var(--sub);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--sub-2);color:var(--ink);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-icon{background:none;border:none;cursor:pointer;color:var(--sub-2);font-size:14px;padding:5px 7px;border-radius:7px;transition:background .15s,color .15s;}
  .btn-icon:hover{color:var(--red);background:#FBE9E8;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--sub-2);padding:7px 8px;border-bottom:1.5px solid var(--border);font-weight:700;letter-spacing:.04em;white-space:nowrap;}
  td{padding:7px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tr:hover td{background:var(--panel-2);}
  tfoot td{font-weight:700;}
  .mono{font-variant-numeric:tabular-nums;}
  .ta-r{text-align:right;}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
  .row > div{flex:1;min-width:110px;}
  .chip{display:inline-block;padding:3px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;color:#fff;}
  .chip-green{background:var(--green);} .chip-green-dark{background:#0F6B2C;} .chip-orange{background:var(--orange);} .chip-red{background:var(--red);} .chip-grey{background:var(--sub-2);} .chip-navy{background:var(--slate);}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar select{width:auto;min-width:200px;}
  .filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .filterbtn{border:1.5px solid var(--border);background:var(--panel);border-radius:var(--radius-pill);padding:6px 13px;font-size:12px;cursor:pointer;color:var(--sub);font-weight:600;transition:all .15s;}
  .filterbtn:hover{border-color:var(--sub-2);}
  .filterbtn.active{background:var(--slate);color:#fff;border-color:var(--slate);}
  .cust-card{border:1.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;transition:border-color .15s;}
  .cust-card:hover{border-color:var(--sub-2);}
  .cust-top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;}
  .cust-top input[type=text]{flex:1;min-width:130px;font-weight:700;border:1.5px solid transparent;background:transparent;padding:6px 8px;}
  .cust-top input[type=text]:hover{border-color:var(--border);}
  .prefs-body{display:none;padding:6px 14px 16px;border-top:1px solid var(--border-soft);}
  .prefs-body.open{display:block;}
  .switch{position:relative;width:34px;height:19px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#CBD2C9;border-radius:20px;transition:.15s;}
  .slider:before{content:"";position:absolute;height:13px;width:13px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider:before{transform:translateX(15px);}
  .tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--slate);color:#fff;border-radius:var(--radius-pill);padding:3px 8px 3px 10px;font-size:11px;font-weight:600;}
  .tag-chip button{background:none;border:none;color:#fff;cursor:pointer;font-size:12px;padding:0;line-height:1;opacity:0.55;}
  .tag-chip button:hover{opacity:1;}
  .tag-chip-sm{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:var(--radius-pill);padding:1px 9px;font-size:10.5px;font-weight:700;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0;}
  .tag-suggest{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
  .tag-suggest span{background:var(--panel-2);border:1px dashed var(--border);border-radius:var(--radius-pill);padding:2px 8px;font-size:11px;color:var(--sub);cursor:pointer;}
  .pref-grid2{display:grid;grid-template-columns:repeat(auto-fit, minmax(230px,1fr));gap:6px 18px;}
  .pref-row2{display:flex;align-items:center;gap:8px;}
  .pref-row2 .cutname{width:90px;font-size:12px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pref-scale{display:flex;gap:4px;}
  .pref-btn{width:27px;height:23px;border-radius:7px;border:2px solid transparent;cursor:pointer;font-size:11px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0.5;transition:all .12s;}
  .pref-btn.sel{opacity:1;border-color:var(--ink-dark);transform:scale(1.08);}
  .route-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:6px;background:var(--panel);flex-wrap:wrap;}
  .route-item .idx{width:20px;color:var(--sub-2);font-size:12px;font-weight:700;}
  .route-item .name{flex:1;font-size:13px;min-width:100px;}
  .pool-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:var(--radius-pill);padding:6px 6px 6px 12px;font-size:12.5px;margin:3px;}
  .pool-actions{display:none;gap:4px;flex-wrap:wrap;padding:6px 0 10px;}
  .pool-actions.open{display:flex;}
  .pool-actions button{font-size:11px;padding:4px 10px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--panel);cursor:pointer;}
  .foot-note{font-size:11.5px;color:var(--sub-2);margin-top:8px;line-height:1.5;}
  .warn{font-size:12px;padding:8px 10px;border-radius:var(--radius-sm);background:#FBE9E8;color:#A83730;margin-bottom:10px;}
  .setup-banner{background:var(--red);color:#fff;padding:12px 16px;border-radius:var(--radius-md);font-size:13px;margin-bottom:16px;}
  .empty{color:var(--sub-2);font-size:13px;padding:14px 0;}
  .kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .kpi{flex:1;min-width:130px;background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm);}
  .kpi .label{font-size:10.5px;color:var(--sub-2);text-transform:uppercase;font-weight:700;letter-spacing:.03em;}
  .kpi .value{font-size:19px;font-weight:800;color:var(--ink);margin-top:3px;letter-spacing:-0.01em;}
  .kpi-clickable{cursor:pointer;transition:border-color .15s, box-shadow .15s;}
  .kpi-clickable:hover{border-color:var(--sub-2);}
  .kpi-active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .dispo-section{border:1.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;overflow:hidden;}
  .dispo-section-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--panel);transition:background .15s;}
  .dispo-section-head:hover{background:var(--panel-2);}
  .dispo-chevron{display:inline-block;color:var(--sub-2);transition:transform .15s;font-size:12px;}
  .dispo-chevron.open{transform:rotate(90deg);}
  .dispo-section-title{font-weight:700;font-size:13.5px;}
  .dispo-section-body{display:none;padding:14px;border-top:1px solid var(--border-soft);background:var(--panel-2);}
  .dispo-section-body.open{display:block;}
  .dispo-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px,1fr));gap:10px;}
  .dispo-cust-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}
  .dispo-cust-name{font-size:12px;font-weight:600;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dispo-cust-inputwrap{display:flex;align-items:center;gap:5px;}
  .dispo-cust-inputwrap input{text-align:right;}
  .dispo-cust-unit{font-size:11px;color:var(--sub-2);flex-shrink:0;}
  .dispo-piece-hint{font-size:10.5px;color:var(--sub-2);margin-top:3px;text-align:right;}
  .dispo-section.dispo-done{border-color:var(--accent);}
  .dispo-section.dispo-done .dispo-section-head{background:var(--accent-soft);}
  .dispo-cust-inputwrap input:disabled{background:var(--panel-2);color:var(--sub-2);}
  .load-overlay{position:fixed;inset:0;background:rgba(250,251,249,0.72);backdrop-filter:blur(1px);z-index:999;display:none;align-items:center;justify-content:center;}
  .load-overlay.show{display:flex;}
  .load-overlay-logo{width:72px;height:auto;animation:pulseLogo 1.1s ease-in-out infinite;}
  @keyframes pulseLogo{0%,100%{opacity:0.55;transform:scale(0.94);}50%{opacity:1;transform:scale(1.04);}}
  .cust-req-card{border:1.5px solid var(--border);border-radius:var(--radius-md);padding:11px 14px;margin-bottom:8px;transition:border-color .15s;}
  .cust-req-card:hover{border-color:var(--sub-2);}
  .cust-req-name-row{font-weight:700;font-size:14px;margin-bottom:8px;letter-spacing:-0.01em;}
  .cust-req-actions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cust-req-body{margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);display:none;}
  .cust-req-body.open{display:block;}
  .group-heading{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#fff;font-weight:700;margin:10px 0 8px;padding:7px 12px;background:var(--slate);border-radius:var(--radius-sm);display:block;width:100%;}
  .group-heading:first-child{margin-top:0;}
  .group-heading-clickable{cursor:pointer;user-select:none;}
  .group-body{display:none;}
  .group-body.open{display:block;}
  @media (max-width:700px){
    main{padding:14px 14px 60px;}
    .panel{padding:14px 15px;}
    .row{flex-direction:column;align-items:stretch;}
    .row > div{width:100%;min-width:0;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar select{width:100%;min-width:0;}
    header h1{font-size:14.5px;}
    header .logo-img{height:26px;}
    th,td{padding:6px 6px;font-size:12px;}
    input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px;}
    .kpi{min-width:100%;}
    .pref-row2 .cutname{width:96px;font-size:11px;}
    .pref-btn{width:24px;height:22px;}
  }

  /* ---------- MOBILE (Handy) ---------- */
  .bottom-nav{display:none;}
  @media (max-width:820px){
    .sidebar{display:none !important;}
    .main-col{margin-left:0 !important;}
    main{padding-bottom:96px !important;}
    header{padding:10px 12px;gap:8px;}
    header h1{display:block;font-size:15px;}
    header .save #saveState{display:none;}
    header .header-animalpick{justify-content:flex-end;min-width:0;}
    header .header-animalpick select{max-width:160px;}
    .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#1F2A24;border-top:1px solid #000;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;}
    .bottom-nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#A9B3AD;padding:5px 2px;border-radius:10px;cursor:pointer;}
    .bottom-nav button svg{width:22px;height:22px;}
    .bottom-nav button.active{color:#fff;background:rgba(255,255,255,0.12);}
    .filterbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    .filterbar > *{flex-shrink:0;}
    header .header-animalpick select{min-width:0;max-width:220px;}
    .pay-card .row{flex-direction:row !important;gap:8px;}
    .pay-card .row > div{min-width:0 !important;}
  }
  .tour-pick{display:flex;flex-direction:column;gap:10px;}
  .tour-pick button{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--panel);font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);}
  .tour-pick button span{font-size:13px;font-weight:600;color:var(--sub);}
  .tour-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .tour-head h2{margin:0;flex:1;}
  .tour-next{border:2px solid var(--accent);border-radius:var(--radius-lg);background:var(--panel);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-md);}
  .tour-next .tn-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-dark);font-weight:800;}
  .tour-next .tn-name{font-size:20px;font-weight:800;margin:4px 0 2px;}
  .tour-next .tn-addr{font-size:14px;color:var(--sub);margin-bottom:10px;}
  .tour-hint{background:#FFF4E5;border:1px solid #F3D2A5;color:#7A4A0E;border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;font-weight:600;margin-bottom:10px;}
  .tour-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .tour-facts div{background:var(--panel-2);border-radius:var(--radius-sm);padding:8px 10px;}
  .tour-facts .l{font-size:10.5px;color:var(--sub-2);text-transform:uppercase;font-weight:700;}
  .tour-facts .v{font-size:16px;font-weight:800;}
  .tour-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tour-actions a,.tour-actions button{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 10px;border-radius:var(--radius-md);font-size:15px;font-weight:800;text-decoration:none;border:none;cursor:pointer;}
  .tour-actions .ta-nav{background:var(--slate);color:#fff;}
  .tour-actions .ta-call{background:var(--panel-2);color:var(--ink);border:1.5px solid var(--border);}
  .tour-actions .ta-done{grid-column:1 / -1;background:var(--accent);color:#fff;font-size:17px;padding:16px;}
  .tour-actions .disabled{opacity:.4;pointer-events:none;}
  .hist-table{width:100%;border-collapse:collapse;font-size:13px;}
  .hist-table td{padding:5px 6px;border-bottom:1px solid var(--border-soft);}
  .hist-table tr.hist-no{color:var(--sub-2);}
  .hist-table tr.hist-cur td{font-weight:700;}
  .tour-depot{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:10px;}
  .tour-depot .l{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .tour-depot .td-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
  .tour-depot .nm{flex:1;font-size:14px;font-weight:600;}
  .tour-depot .sub{font-size:12px;color:var(--sub);font-weight:400;}
  .tour-stop{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:6px;background:var(--panel);}
  .tour-stop .idx{width:22px;font-weight:800;color:var(--sub-2);}
  .tour-stop .nm{flex:1;font-size:14px;font-weight:600;}

    <div id="loginOverlay" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Inter',sans-serif;background:#F1F4EF;">
      <div style="display:flex;flex-direction:column;gap:10px;width:260px;background:#fff;padding:24px;border-radius:16px;border:1px solid #DBE1D8;">
        <h2 style="margin:0 0 6px;">Hofverkauf</h2>
        <button id="googleLoginBtn" type="button" style="background:#1C9A47;color:#fff;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;">Mit Google anmelden</button>
        <p id="loginErr" style="color:#DD4C46;font-size:12px;margin:0;">${msg||''}</p>
      </div>
    </div>`;
  document.getElementById('googleLoginBtn').addEventListener('click', () => {
    // Als App installiert (Home-Bildschirm): Popups funktionieren dort nicht -> direkt per Weiterleitung anmelden
    const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (standalone) { auth.signInWithRedirect(googleProvider); return; }
    auth.signInWithPopup(googleProvider).catch(err => {
      // Popup blockiert / PWA im Standalone-Modus -> Redirect-Login
      if (err && (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment')) {
        auth.signInWithRedirect(googleProvider);
      } else if (err && err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
        document.getElementById('loginErr').textContent = "Anmeldung fehlgeschlagen: " + err.message;
      }
    });
  });
}

function logout(){ auth.signOut(); }

auth.getRedirectResult().catch(err => console.warn('Redirect-Login', err));

auth.onAuthStateChanged(user => {
  if (user) {
    const email = (user.email || '').toLowerCase();
    if (!ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email)) {
      auth.signOut().then(() => showLoginScreen(`Kein Zugriff für ${email}`));
      return;
    }
    if (document.getElementById('loginOverlay')) location.reload();
    else { pull(); startLive(); }
  } else {
    showLoginScreen();
  }
});

// ---------- SYNC ----------
// Prinzip wie PowerApps-Collection: Anzeige läuft auf "state" (lokaler Cache), Abgleich mit Firebase im Hintergrund.
// Konfliktschutz: Jeder Speichervorgang prüft per ETag, ob sich der Server-Stand seit dem letzten Abgleich geändert hat.
// Falls ja (anderes Gerät hat gespeichert), werden die Änderungen beider Seiten zusammengeführt statt überschrieben.
const LOCAL_CACHE_KEY = "hofwerk-cache-v1";
const LOCAL_BASE_KEY = "hofwerk-base-v1";   // letzter bekannter Server-Stand + ETag
const STATE_DEFAULTS = () => ({allocations:{},routeOrder:{},payments:{},tags:[],animalCuts:{},dispoDone:{},settings:{},tourStart:{}});
let serverEtag = null, baseState = null, dirty = false;

function loadLocalCache(){
  try{
    const b = JSON.parse(localStorage.getItem(LOCAL_BASE_KEY) || 'null');
    if (b && b.etag && b.data) { serverEtag = b.etag; baseState = b.data; }
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if (raw){
      const cached = JSON.parse(raw);
      if (cached && cached.animals){
        state = Object.assign(STATE_DEFAULTS(), cached);
        migrateState();
        return true;
      }
    }
  }catch(e){}
  return false;
}
function saveLocalCache(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state)); }catch(e){}
}
function saveBase(etag, data){
  serverEtag = etag; baseState = JSON.parse(JSON.stringify(data));
  try{ localStorage.setItem(LOCAL_BASE_KEY, JSON.stringify({etag, data: baseState})); }catch(e){}
}

// --- 3-Wege-Zusammenführung (Basis = letzter gemeinsamer Stand, lokal, Server) ---
function isEmptyVal(v){ return v==null || (Array.isArray(v) ? v.length===0 : (typeof v==='object' && Object.keys(v).length===0)); }
function deepEq(a,b){
  if (isEmptyVal(a) && isEmptyVal(b)) return true;
  if (a===b) return true;
  if (typeof a!=='object' || typeof b!=='object' || a===null || b===null) return false;
  if (Array.isArray(a)!==Array.isArray(b)) return false;
  const ka = Object.keys(a).filter(k=>!isEmptyVal(a[k])), kb = Object.keys(b).filter(k=>!isEmptyVal(b[k]));
  if (ka.length!==kb.length) return false;
  return ka.every(k => deepEq(a[k], b[k]));
}
const isIdArray = v => Array.isArray(v) && v.length>0 && v.every(x => x && typeof x==='object' && 'id' in x);
const isObj = v => v && typeof v==='object' && !Array.isArray(v);
function merge3(base, local, remote){
  if (deepEq(local, remote)) return local;
  if (deepEq(local, base)) return remote;     // nur Server geändert
  if (deepEq(remote, base)) return local;     // nur lokal geändert
  // beide geändert -> tiefer zusammenführen
  if ((isIdArray(local)||isEmptyVal(local)) && (isIdArray(remote)||isEmptyVal(remote)) && (isIdArray(local)||isIdArray(remote))) {
    const toMap = arr => Object.fromEntries((arr||[]).map(x=>[x.id,x]));
    const m = merge3(toMap(base), toMap(local), toMap(remote));
    const order = [...(local||[]).map(x=>x.id), ...(remote||[]).map(x=>x.id)].filter((id,i,a)=>a.indexOf(id)===i);
    return order.filter(id => m[id]!==undefined).map(id => m[id]);
  }
  if (isObj(local) && isObj(remote)) {
    const b = isObj(base) ? base : {};
    const out = {};
    new Set([...Object.keys(local), ...Object.keys(remote)]).forEach(k => {
      const inL = !isEmptyVal(local[k]), inR = !isEmptyVal(remote[k]);
      if (!inL && !inR) return;
      if (!inL && !isEmptyVal(b[k])) { if (!deepEq(remote[k], b[k])) out[k] = remote[k]; return; } // lokal gelöscht
      if (!inR && !isEmptyVal(b[k])) { if (!deepEq(local[k], b[k])) out[k] = local[k]; return; } // auf Server gelöscht
      out[k] = merge3(b[k], local[k], remote[k]);
    });
    return out;
  }
  return local; // echter Konflikt auf demselben Wert: lokale Eingabe gewinnt
}
function applyRemote(remote){
  const local = JSON.parse(JSON.stringify(state));
  const merged = baseState ? merge3(baseState, local, remote) : remote;
  state = Object.assign(STATE_DEFAULTS(), merged);
  migrateState();
  saveLocalCache();
  return !deepEq(merged, remote); // true = lokale Änderungen müssen noch hochgeladen werden
}


// ---------- LIVE-SYNC (wie Hofpuls): Firebase meldet Änderungen, die App gleicht automatisch ab ----------
let liveES = null, liveTimer = null, liveRetry = null;
function isTyping(){ const a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
function scheduleLivePull(delay){
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    if (document.visibilityState !== 'visible') return;           // beim Zurückkehren gleicht visibilitychange ab
    if (pulling || pushInFlight || dirty || isTyping()) { scheduleLivePull(2000); return; } // Eingabe nicht überschreiben
    pull();
  }, delay == null ? 1200 : delay);
}
async function startLive(){
  if (!auth.currentUser || typeof EventSource === 'undefined') return;
  clearTimeout(liveRetry);
  if (liveES) { liveES.close(); liveES = null; }
  let first = true;
  try {
    liveES = new EventSource(await firebaseDataUrl());
  } catch(e) { liveRetry = setTimeout(startLive, 15000); return; }
  const onChange = () => { if (first) { first = false; return; } scheduleLivePull(); };
  liveES.addEventListener('put', onChange);
  liveES.addEventListener('patch', onChange);
  liveES.addEventListener('auth_revoked', () => startLive());   // Token abgelaufen -> neu verbinden
  liveES.addEventListener('cancel', () => { liveES.close(); liveES = null; liveRetry = setTimeout(startLive, 15000); });
  liveES.onerror = () => { if (liveES && liveES.readyState === 2) { liveES = null; liveRetry = setTimeout(startLive, 10000); } };
}

async function pull(){
  if (pushInFlight) return;
  pulling = true; setStatus('busy','gleicht ab…');
  try{
    const res = await fetch(await firebaseDataUrl(), {method:'GET', headers:{'X-Firebase-ETag':'true'}});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const etag = res.headers.get('ETag');
    const data = await res.json();
    if (etag && etag === serverEtag && !dirty) { setStatus('ok','synchronisiert'); pulling = false; return; }
    if (data && data.animals){
      const needPush = applyRemote(data);
      saveBase(etag, data);
      if (needPush || dirty) { pulling = false; render(); push(); return; }
    }
    setStatus('ok','synchronisiert');
  }catch(e){ setStatus('err','offline (zeige zwischengespeicherten Stand)'); }
  pulling = false; render();
}
// Repariert Datensätze aus älteren Versionen der App (fehlende Felder ergänzen, Datenmüll bereinigen)
function migrateState(){
  if (!state.dispoDone) state.dispoDone = {};
  if (!state.settings) state.settings = {};
  if (!state.tourStart) state.tourStart = {};
  // Verwaiste Bestellungen entfernen (Kunde existiert nicht mehr)
  state.orders = (state.orders||[]).filter(o => state.customers.some(c => c.id === o.customerId));

  // Duplikate je Kunde+Tier bereinigen: nur den letzten (aktuellsten) Eintrag behalten
  const seen = {}; const deduped = [];
  for (let i = state.orders.length - 1; i >= 0; i--) {
    const o = state.orders[i];
    const key = o.customerId + "_" + o.animalId;
    if (seen[key]) continue;
    seen[key] = true;
    deduped.unshift(o);
  }
  state.orders = deduped;

  const fkCut = state.cuts.find(c => c.name === "Fleischkäse");
  const fkPiece = fkCut ? Number(fkCut.pieceKg||0.5) : 0.5;

  state.orders.forEach(o => {
    if (!o.status) o.status = (Number(o.orderedKg) > 0) ? ORDER_STATUS.ORDERED : ORDER_STATUS.ASKED;
    if (o.route === undefined) o.route = null;
    if (o.routeComment === undefined) o.routeComment = "";
    if (o.depotAt === undefined) o.depotAt = null;
    if (o.orderedKg === undefined) o.orderedKg = 0;
    if (o.comment === undefined) o.comment = "";
    if (o.fkWishCount === undefined) {
      // Migration von altem kg-Feld auf Anzahl-Feld (à Stückgrösse Fleischkäse)
      o.fkWishCount = o.fkWishKg !== undefined ? Math.round(Number(o.fkWishKg||0) / fkPiece) : 0;
    }
  });
  (state.customers||[]).forEach(c => {
    if (c.active === undefined) c.active = true;
    if (!c.groups) c.groups = [];
    if (!c.prefs) c.prefs = {};
  });
  (state.animals||[]).forEach(a => {
    if (a.liveWeight === undefined) a.liveWeight = 0;
    if (a.slaughterWeight === undefined) a.slaughterWeight = 0;
    if (!state.animalCuts[a.id]) state.animalCuts[a.id] = state.cuts.map(c=>c.id);
    if (!state.inventory[a.id]) state.inventory[a.id] = {};
  });
}
let pushInFlight = false, pushQueued = false;
async function push(){
  saveLocalCache();
  if (pushInFlight) { pushQueued = true; return; }
  pushInFlight = true;
  setStatus('busy','speichert…');
  try{
    for (let attempt = 0; attempt < 4; attempt++) {
      const url = await firebaseDataUrl();
      if (!serverEtag) { // noch kein bekannter Server-Stand -> zuerst holen und zusammenführen
        const g = await fetch(url, {headers:{'X-Firebase-ETag':'true'}});
        if (!g.ok) throw new Error('HTTP ' + g.status);
        const etag = g.headers.get('ETag'); const remote = await g.json();
        if (remote && remote.animals) applyRemote(remote);
        saveBase(etag, remote || {});
      }
      const body = JSON.stringify(state);
      const res = await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json','if-match':serverEtag,'X-Firebase-ETag':'true'}, body});
      if (res.status === 412) {
        // Anderes Gerät hat inzwischen gespeichert -> zusammenführen und erneut versuchen
        const etag = res.headers.get('ETag'); const remote = await res.json();
        if (remote && remote.animals) applyRemote(remote);
        saveBase(etag, remote || {});
        render();
        continue;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      saveBase(res.headers.get('ETag'), JSON.parse(body));
      dirty = false;
      setStatus('ok','synchronisiert');
      break;
    }
  }catch(e){ setStatus('err','Speichern fehlgeschlagen (lokal gesichert)'); }
  pushInFlight = false;
  if (pushQueued) { pushQueued = false; push(); }
}
// Für Klicks/Auswahl: sofort neu zeichnen + debounced speichern
function commit(){
  const scrollY = window.scrollY;
  saveLocalCache();
  render();
  window.scrollTo(0, scrollY);
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 600);
}
// Für laufende Texteingabe: nur Wert im Speicher aktualisieren, NICHT neu zeichnen und NICHT speichern.
// Gespeichert wird erst beim Verlassen des Feldes (commitOnBlur) - Sicherheitsnetz: wenn die App in den Hintergrund geht.
function commitTyping(){
  dirty = true;
  saveLocalCache();
}
// Beim Verlassen des Feldes (Blur/Tab): sofort neu zeichnen + zügig speichern
function commitOnBlur(){
  const scrollY = window.scrollY;
  saveLocalCache();
  render(true);
  window.scrollTo(0, scrollY);
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 150);
}

// Beim Verlassen eines Tipp-Feldes (Blur/Tab) synchronisieren
function bindBlurCommit(selectors){
  selectors.forEach(sel => document.querySelectorAll(sel).forEach(el => el.addEventListener('blur', commitOnBlur)));
}

// ---------- HELPERS ----------
function activeCustomers(){ return state.customers.filter(c=>c.active); }
function customerById(id){ return state.customers.find(c=>c.id===id); }
function cutById(id){ return state.cuts.find(c=>c.id===id); }
function animalById(id){ return state.animals.find(a=>a.id===id); }
function ordersForAnimal(animalId){ return state.orders.filter(o=>o.animalId===animalId); }
function orderFor(customerId, animalId){ return state.orders.find(o=>o.customerId===customerId && o.animalId===animalId); }
// Deponieren: Bestellung wird bei einem anderen Kunden (Gastgeber) abgeladen, der weiterverteilt.
// Gilt nur, wenn der Gastgeber für dasselbe Tier eine bestätigte Bestellung hat - sonst normaler eigener Halt.
function depotHost(o){
  if (!o || !o.depotAt || o.depotAt === o.customerId) return null;
  const h = state.orders.find(x => x.animalId===o.animalId && x.customerId===o.depotAt && x.status===ORDER_STATUS.ORDERED && !x.depotAt);
  return (h && customerById(h.customerId)) ? h : null;
}
function depotGuests(host){
  return state.orders.filter(x => x.animalId===host.animalId && x.depotAt===host.customerId && x.id!==host.id && x.status===ORDER_STATUS.ORDERED && customerById(x.customerId))
    .sort((a,b)=>customerById(a.customerId).name.localeCompare(customerById(b.customerId).name,'de'));
}
function setDelivered(o, val){
  const t = val ? new Date().toISOString() : null;
  [o, ...depotGuests(o)].forEach(x => { x.delivered = val; x.deliveredAt = t; });
}
function depotSelectHtml(o, cls){
  const others = state.customers.filter(c => c.id !== o.customerId).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const host = o.depotAt ? customerById(o.depotAt) : null;
  const warn = host && !depotHost(o) ? `<div class="warn" style="margin-top:6px;">${escapeHtml(host.name)} hat für dieses Tier keine bestätigte Bestellung - wird als eigener Halt geliefert.</div>` : '';
  return `<label style="margin-top:12px;">Lieferung deponieren bei</label>
    <select class="${cls}"><option value="">- direkt an Kunde -</option>${others.map(c=>`<option value="${c.id}" ${o.depotAt===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>${warn}`;
}
function setDepot(o, hostId){
  o.depotAt = hostId || null;
  if (o.depotAt) { o.route = null; }
  o.delivered = false; o.deliveredAt = null;
}
function statusFor(customerId, animalId){
  const o = orderFor(customerId, animalId);
  if (!o) return ORDER_STATUS.NOT_ASKED;
  if (!o.status) return (Number(o.orderedKg) > 0) ? ORDER_STATUS.ORDERED : ORDER_STATUS.ASKED;
  return o.status;
}
// Fleischkäse-Inventar ist immer die Summe aller bestätigten Bestellungen (kein manueller Wert) - synchronisiert bei jedem Aufruf
function syncFkInventory(animalId){
  const fkCut = state.cuts.find(c => c.name === "Fleischkäse");
  if (!fkCut || !animalCutsList(animalId).includes(fkCut.id)) return;
  const pieceKg = Number(fkCut.pieceKg || 0.5);
  const sum = ordersForAnimal(animalId)
    .filter(o => o.status === ORDER_STATUS.ORDERED && customerById(o.customerId))
    .reduce((s,o) => s + Number(o.fkWishCount||0) * pieceKg, 0);
  if (!state.inventory[animalId]) state.inventory[animalId] = {};
  state.inventory[animalId][fkCut.id] = sum;
}

function sortedActiveCuts(animalId){
  const inv = state.inventory[animalId] || {};
  const activeCutIds = animalCutsList(animalId).filter(cid => Number(inv[cid]||0) > 0);
  return activeCutIds.slice().sort((a,b)=> Number(inv[a]||0) - Number(inv[b]||0));
}

// Füllt EINEN Fleischteil-Vorschlag, aber nur für Kunden, die dort noch keinen Wert haben (bestehende Werte bleiben unangetastet).
// Berücksichtigt, was der Kunde bei den vorherigen (kleineren) Fleischteilen bereits erhalten hat - so wirken
// Korrekturen bei einem Stück automatisch auf die Vorschläge aller nachfolgenden Stücke.
function ensureCutFilled(animalId, cutId, priorCutIds, custIds){
  if (!state.allocations[animalId]) state.allocations[animalId] = {};
  if (!state.allocations[animalId][cutId]) state.allocations[animalId][cutId] = {};
  const cutAlloc = state.allocations[animalId][cutId];
  const missing = custIds.filter(cid => cutAlloc[cid] === undefined);
  if (missing.length === 0) return;

  const inv = state.inventory[animalId] || {};
  const avail = Number(inv[cutId]||0);
  const cut = cutById(cutId);
  const fkCut = state.cuts.find(c=>c.name==="Fleischkäse");
  const isFk = fkCut && cutId === fkCut.id;

  const remaining = {};
  custIds.forEach(cid => {
    let used = 0;
    priorCutIds.forEach(pcid => { used += Number((state.allocations[animalId][pcid]||{})[cid] || 0); });
    remaining[cid] = orderedTotal(cid, animalId) - used;
  });

  if (isFk) {
    const orders = ordersForAnimal(animalId).filter(o=>o.status===ORDER_STATUS.ORDERED && customerById(o.customerId));
    const wishes = {}; let totalWish = 0;
    const pieceKg = Number(cut.pieceKg||0.5);
    orders.forEach(o => { wishes[o.customerId] = (wishes[o.customerId]||0) + Number(o.fkWishCount||0)*pieceKg; totalWish += Number(o.fkWishCount||0)*pieceKg; });
    if (totalWish > 0) {
      const scale = avail / totalWish;
      custIds.forEach(cid => { if (cutAlloc[cid]===undefined) cutAlloc[cid] = (wishes[cid]||0) * scale; });
    } else {
      const share = avail / custIds.length;
      custIds.forEach(cid => { if (cutAlloc[cid]===undefined) cutAlloc[cid] = share; });
    }
    return;
  }

  const pieceKg = cut ? Number(cut.pieceKg||0) : 0;
  const weights = {};
  custIds.forEach(cid => {
    const custObj = customerById(cid);
    let pref = (custObj && custObj.prefs && custObj.prefs[cutId]!==undefined) ? Number(custObj.prefs[cutId]) : 1;
    const tolKg = orderedTotal(cid, animalId) * 0.05;
    if (pieceKg > 0 && pieceKg > Math.max(0,remaining[cid]) + tolKg) pref *= 0.02;
    weights[cid] = Math.max(0.0001, remaining[cid]) * pref;
  });
  const wSum = custIds.reduce((s,cid)=>s+weights[cid],0);
  custIds.forEach(cid => {
    if (cutAlloc[cid] === undefined) {
      cutAlloc[cid] = wSum>0 ? avail*(weights[cid]/wSum) : avail/custIds.length;
    }
  });
}

// Berechnet alle NICHT als "erledigt" markierten Fleischteile komplett neu (löscht und füllt sequenziell neu),
// erledigte Stücke bleiben als fixer Ausgangspunkt unverändert stehen.
function recalcAnimal(animalId, custIds){
  const cutOrder = sortedActiveCuts(animalId);
  const done = state.dispoDone[animalId] || {};
  cutOrder.forEach(cutId => {
    if (!done[cutId] && state.allocations[animalId]) delete state.allocations[animalId][cutId];
  });
  const priorSoFar = cutOrder.filter(cid => done[cid]);
  cutOrder.forEach(cutId => {
    if (done[cutId]) return;
    ensureCutFilled(animalId, cutId, priorSoFar, custIds);
    priorSoFar.push(cutId);
  });
  correctFinalDeviations(animalId, custIds, cutOrder);
}

// Sicherheitsnetz: gleicht am Schluss verbleibende grössere Abweichungen zwischen Kunden aus,
// indem kg zwischen Kunden innerhalb der gut teilbaren (kleinstückigen) Fleischteile verschoben werden.
// Erledigte Stücke werden dabei nie angetastet.
function correctFinalDeviations(animalId, custIds, cutOrder){
  const alloc = state.allocations[animalId];
  if (!alloc) return;
  const done = state.dispoDone[animalId] || {};
  const fkCut = state.cuts.find(c=>c.name==="Fleischkäse");
  const flexCuts = cutOrder.filter(cid => {
    if (done[cid]) return false;
    if (fkCut && cid === fkCut.id) return false;
    const cut = cutById(cid);
    return cut && Number(cut.pieceKg||0) <= PORTIONABLE_MAX_PIECE;
  });
  if (flexCuts.length === 0) return;

  function totalFor(cid){ return cutOrder.reduce((s,c)=>s+Number((alloc[c]||{})[cid]||0),0); }

  for (let iter = 0; iter < 200; iter++) {
    const diffs = custIds.map(cid => ({cid, diff: totalFor(cid) - orderedTotal(cid, animalId)}));
    const surplus = diffs.filter(d=>d.diff>0.05).sort((a,b)=>b.diff-a.diff);
    const deficit = diffs.filter(d=>d.diff<-0.05).sort((a,b)=>a.diff-b.diff);
    if (surplus.length===0 || deficit.length===0) break;
    const s = surplus[0], d = deficit[0];
    let moved = false;
    for (const cutId of flexCuts) {
      const have = Number((alloc[cutId]||{})[s.cid]||0);
      if (have > 0.02) {
        const amount = Math.min(have, s.diff, -d.diff);
        alloc[cutId][s.cid] -= amount;
        alloc[cutId][d.cid] = (alloc[cutId][d.cid]||0) + amount;
        moved = true;
        break;
      }
    }
    if (!moved) break;
  }
}

const UNLOAD_MIN = 10;          // Abladezeit pro Kunde

let geoQueue = Promise.resolve();
function geocode(address){ // Nominatim erlaubt max. 1 Anfrage pro Sekunde -> Warteschlange
  const p = geoQueue.then(async () => {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=' + encodeURIComponent(address));
    const j = r.ok ? await r.json() : [];
    await new Promise(res => setTimeout(res, 1100));
    return j[0] ? {lat:Number(j[0].lat), lon:Number(j[0].lon)} : null;
  });
  geoQueue = p.catch(() => null);
  return p;
}
async function ensureCustomerGeo(cu){
  if (!cu.address) { if (cu.geo) { delete cu.geo; return true; } return false; }
  if (cu.geo && cu.geo.addr === cu.address) return false;
  const g = await geocode(cu.address).catch(() => null);
  cu.geo = g ? {addr:cu.address, lat:g.lat, lon:g.lon} : {addr:cu.address, failed:true};
  return true;
}
function hofAddress(){ return (state.settings && state.settings.hofAddress) || HOF_ADDRESS; }
async function ensureHofGeo(){
  const a = hofAddress(), s = state.settings;
  if (s.hofGeo && s.hofGeo.addr === a) return false;
  const g = await geocode(a).catch(() => null);
  s.hofGeo = g ? {addr:a, lat:g.lat, lon:g.lon} : {addr:a, failed:true};
  return true;
}
const hasGeo = g => g && !g.failed && isFinite(g.lat) && isFinite(g.lon);
function distM(a, b){
  const R = 6371000, toR = x => x*Math.PI/180;
  const dLat = toR(b.lat-a.lat), dLon = toR(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const legCache = {};
async function routeLegs(points){ // Fahrzeit in Sekunden je Teilstrecke
  const key = points.map(p => p.lon.toFixed(5)+','+p.lat.toFixed(5)).join(';');
  if (legCache[key]) return legCache[key];
  const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + key + '?overview=false');
  const j = await r.json();
  if (j.code !== 'Ok') throw new Error(j.code);
  return legCache[key] = j.routes[0].legs.map(l => l.duration);
}

function deleteAnimal(id){
  if(!confirm('Tier inkl. Bestellungen/Inventar/Dispo wirklich löschen?')) return false;
  state.animals = state.animals.filter(a=>a.id!==id);
  state.orders = state.orders.filter(o=>o.animalId!==id);
  delete state.inventory[id]; delete state.allocations[id]; delete state.animalCuts[id];

  if (ui.selectedAnimalId === id && state.animals[0]) ui.selectedAnimalId = state.animals[0].id;
  return true;
}

// Bestellhistorie eines Kunden: Datum (Schlachtung), Tier, kg (effektiv geliefert, sonst bestellt)
function custHistoryHtml(custId, currentAnimalId){
  const rows = state.orders.filter(o => o.customerId===custId && (o.status===ORDER_STATUS.ORDERED || o.status===ORDER_STATUS.DECLINED))
    .map(o => ({o, a: animalById(o.animalId)})).filter(r => r.a)
    .sort((x,y) => (y.a.slaughterdate||'').localeCompare(x.a.slaughterdate||''));
  const ord = rows.filter(r => r.o.status===ORDER_STATUS.ORDERED);
  const totKg = ord.reduce((s,r) => { const eff = doneAllocatedTotal(custId, r.a.id); return s + (eff>0?eff:Number(r.o.orderedKg||0)); }, 0);
  const head = `<h3 style="margin-top:16px;">Bestellübersicht <span class="foot-note" style="font-weight:400;">${ord.length}× bestellt${ord.length?' · '+fmt(totKg)+' kg total':''}</span></h3>`;
  if (!rows.length) return head + '<div class="foot-note">Noch keine Bestellungen.</div>';
  return head + `<table class="hist-table">${rows.map(({o,a}) => {
    const eff = doneAllocatedTotal(custId, a.id);
    const kg = o.status===ORDER_STATUS.ORDERED ? (eff>0 ? fmt(eff)+' kg' : fmt(o.orderedKg)+' kg <span class="foot-note">bestellt</span>') : '<span class="foot-note">Absage</span>';
    return `<tr class="${o.status===ORDER_STATUS.DECLINED?'hist-no':''}${a.id===currentAnimalId?' hist-cur':''}"><td class="mono">${a.slaughterdate?fmtDate(a.slaughterdate):'-'}</td><td>${escapeHtml(a.name)}</td><td class="mono" style="text-align:right;">${kg}</td></tr>`; }).join('')}</table>`;
}

function requestWaUrl(cu, animal){

      <table>

        <tbody>${rows || '<tr><td colspan="4" class="empty">Keine Fleischteile für dieses Tier hinterlegt.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="2" style="font-weight:700;">Total</td><td class="mono ta-r" style="font-weight:700;">${fmt(total)} kg</td><td></td></tr></tfoot>

      </div>
      <div class="row" style="margin-top:4px;">
        <div><label>Neues Fleischteil erstellen &amp; hinzufügen</label><input type="text" id="newCutName" placeholder="z.B. Rippli"></div>
        <div><label>Richtgrösse kg/Stück</label><input type="number" step="0.05" id="newCutPiece" value="0.5" style="max-width:100px;"></div>
        <div><button class="btn btn-navy" id="createCutBtn">+ Erstellen</button></div>

    <div class="panel">
      <h3 id="manageToggle" style="cursor:pointer;">⚙️ Fleischteil-Katalog verwalten (alle Tiere) ▾</h3>

  document.querySelectorAll('.invKg').forEach(el=>el.addEventListener('input', e=>{ inv[e.target.dataset.cut] = Number(e.target.value); commitTyping(); }));

// ---------- TAB: DISPO ----------
function renderDispo(){
  const animalId = ui.selectedAnimalId;
  syncFkInventory(animalId);
  const ords = ordersForAnimal(animalId).filter(o=>o.status===ORDER_STATUS.ORDERED && customerById(o.customerId));
  const custIds = [...new Set(ords.map(o=>o.customerId))];
  const inv = state.inventory[animalId] || {};

  if (custIds.length === 0) {
    document.getElementById('tabContent').innerHTML = `<div class="panel"><h2>Disponieren</h2><div class="empty">Für dieses Tier gibt es noch keine bestätigten Bestellungen.</div></div>`;
    return;
  }

  const cutOrder = sortedActiveCuts(animalId);
  cutOrder.forEach((cutId, idx) => { ensureCutFilled(animalId, cutId, cutOrder.slice(0, idx), custIds); });

  const alloc = state.allocations[animalId] || {};
  const custTotals = {};
  custIds.forEach(cid => custTotals[cid] = cutOrder.reduce((s,cid2)=> s + Number((alloc[cid2]||{})[cid]||0), 0));

  const diffChipFor = (cid) => {
    const ordered = orderedTotal(cid, animalId);
    const got = custTotals[cid];
    const diffPct = ordered>0 ? ((got-ordered)/ordered*100) : 0;
    let chip;
    if (diffPct >= 0) {
      chip = diffPct <= 10 ? 'chip-green' : 'chip-green-dark';
    } else {
      chip = diffPct >= -10 ? 'chip-orange' : 'chip-red';
    }
    return {diffPct, chip};
  };

  const summaryRows = custIds.map(cid => {
    const ordered = orderedTotal(cid, animalId);
    const got = custTotals[cid];
    const {diffPct, chip} = diffChipFor(cid);
    return `<tr><td>${escapeHtml(customerById(cid)?.name||'?')}</td><td class="mono ta-r">${fmt(got)} kg</td><td class="mono ta-r">${fmt(ordered)} kg</td><td class="ta-r"><span class="chip ${chip}">${diffPct>=0?'+':''}${diffPct.toFixed(0)}%</span></td></tr>`;
  }).join('');

  const totalGot = custIds.reduce((s,cid)=>s+custTotals[cid],0);
  const totalOrdered = custIds.reduce((s,cid)=>s+orderedTotal(cid,animalId),0);
  const avgDiff = custIds.length ? custIds.reduce((s,cid)=>s+diffChipFor(cid).diffPct,0)/custIds.length : 0;

  const fkCut = state.cuts.find(c=>c.name==="Fleischkäse");
  const fkPieceKg = fkCut ? Number(fkCut.pieceKg||0.5) : 0.5;
  const done = state.dispoDone[animalId] || {};

  const sections = cutOrder.map(cutId => {
    const cut = cutById(cutId);
    const isFk = fkCut && cutId === fkCut.id;
    const avail = Number(inv[cutId]||0);
    const cutAlloc = alloc[cutId] || {};
    const sum = custIds.reduce((s,cid)=>s+Number(cutAlloc[cid]||0),0);
    const isOpen = ui.dispoOpenCut === cutId;
    const isDone = !!done[cutId];
    const okMatch = Math.abs(sum-avail) < 0.05;

    const custCards = custIds.map(cid => {
      const v = Number(cutAlloc[cid]||0);
      const displayVal = isFk ? (v/fkPieceKg) : v;
      const cu = customerById(cid);
      const {diffPct, chip} = diffChipFor(cid);
      const prefVal = (cu && cu.prefs && cu.prefs[cutId]!==undefined) ? Number(cu.prefs[cutId]) : 1;
      const closestLvl = PREF_LEVELS.reduce((a,b)=> Math.abs(b.v-prefVal)<Math.abs(a.v-prefVal) ? b : a);
      const borderColor = prefVal===1 ? 'var(--border)' : closestLvl.color;
      const pieceHint = (!isFk && cut.pieceKg > 0) ? `<div class="dispo-piece-hint">≈ ${(v/Number(cut.pieceKg)).toFixed(1)} Stk à ${fmt(Number(cut.pieceKg))}kg</div>` : '';
      return `<div class="dispo-cust-card" style="border-color:${borderColor};border-width:2px;">
        <div class="dispo-cust-name">${escapeHtml(cu?cu.name:'?')} <span class="chip ${chip}" style="margin-left:4px;">${diffPct>=0?'+':''}${diffPct.toFixed(0)}%</span></div>
        <div class="dispo-cust-inputwrap">
          <input type="number" step="${isFk?'1':'0.1'}" class="mono dispoCell" data-cut="${cutId}" data-cust="${cid}" data-unit="${isFk?'stk':'kg'}" value="${fmt(displayVal)}" ${isDone?'disabled':''}>
          <span class="dispo-cust-unit">${isFk?'Stk':'kg'}</span>
        </div>
        ${pieceHint}
      </div>`;
    }).join('');

    return `<div class="dispo-section ${isDone?'dispo-done':''}">
      <div class="dispo-section-head" data-cut="${cutId}">
        <span class="dispo-chevron ${isOpen?'open':''}">▸</span>
        <span class="dispo-section-title">${escapeHtml(cut.name)}</span>
        ${isDone?'<span class="chip chip-green">✓ Erledigt</span>':''}
        <span class="chip ${okMatch?'chip-green':'chip-orange'}" style="margin-left:auto;">${fmt(isFk?sum/fkPieceKg:sum)} / ${fmt(isFk?avail/fkPieceKg:avail)} ${isFk?'Stk':'kg'}</span>
        <button class="btn btn-ghost btn-sm doneToggle" data-cut="${cutId}">${isDone?'Wieder öffnen':'✓ Als erledigt markieren'}</button>
      </div>
      <div class="dispo-section-body ${isOpen?'open':''}">
        <div class="dispo-grid">${custCards}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <div class="panel">
      <h2>Kunden-Übersicht</h2>
      <div class="scrollx">
        <table>
          <thead><tr><th>Kunde</th><th class="ta-r">Zugeteilt</th><th class="ta-r">Bestellt</th><th class="ta-r">Abweichung</th></tr></thead>
          <tbody>${summaryRows}</tbody>
          <tfoot><tr><td>Total / Ø Abweichung</td><td class="mono ta-r">${fmt(totalGot)} kg</td><td class="mono ta-r">${fmt(totalOrdered)} kg</td><td class="ta-r">${avgDiff>=0?'+':''}${avgDiff.toFixed(0)}%</td></tr></tfoot>
        </table>
      </div>
    </div>
    <div class="panel">
      <h2>Fleischteile - der Reihe nach verteilen</h2>
      <p class="foot-note" style="margin-top:-8px;margin-bottom:12px;">Von wenig verfügbar zu viel verfügbar, aufklappen und pro Person korrigieren. Änderungen wirken sich auf den Vorschlag der folgenden Stücke aus. Als erledigt markierte Stücke bleiben fix, wenn du neu berechnest.</p>
      <div style="margin-bottom:12px;"><button class="btn btn-ghost btn-sm" id="resetAllocBtn">↺ Alle offenen Vorschläge neu berechnen</button></div>
      ${sections}
    </div>
  `;
  document.querySelectorAll('.dispo-section-head').forEach(el=>el.addEventListener('click', e=>{
    if (e.target.closest('.doneToggle')) return;
    const cutId = e.currentTarget.dataset.cut;
    ui.dispoOpenCut = (ui.dispoOpenCut === cutId) ? null : cutId;
    render();
  }));
  document.querySelectorAll('.doneToggle').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const cutId = e.target.dataset.cut;
    withLoader(() => {
      if (!state.dispoDone[animalId]) state.dispoDone[animalId] = {};
      const nowDone = !state.dispoDone[animalId][cutId];
      state.dispoDone[animalId][cutId] = nowDone;
      recalcAnimal(animalId, custIds);
      if (nowDone) {
        // Automatisch zum nächsten noch offenen Fleischteil weiterspringen (max. eines gleichzeitig offen)
        const idx = cutOrder.indexOf(cutId);
        const next = cutOrder.slice(idx+1).find(cid2 => !state.dispoDone[animalId][cid2]);
        ui.dispoOpenCut = next || null;
      }
      commit();
    });
  }));
  document.getElementById('resetAllocBtn').addEventListener('click', () => {
    withLoader(() => { recalcAnimal(animalId, custIds); commit(); });
  });
  document.querySelectorAll('.dispoCell').forEach(el=>el.addEventListener('input', e=>{
    const cutId = e.target.dataset.cut, cid = e.target.dataset.cust;
    const raw = Number(e.target.value);
    const isFkUnit = e.target.dataset.unit === 'stk';
    const cutObj = cutById(cutId);
    const pieceKg = cutObj?Number(cutObj.pieceKg||0.5):0.5;
    const kgVal = isFkUnit ? raw*pieceKg : raw;
    if (!state.allocations[animalId]) state.allocations[animalId] = {};
    if (!state.allocations[animalId][cutId]) state.allocations[animalId][cutId] = {};
    state.allocations[animalId][cutId][cid] = kgVal;
    commitTyping();
  }));
  bindBlurCommit(['.dispoCell']);
}

      <div class="dnd-dock">${cols.map(c => { const n = colOrders(c).length;
        return `<div class="dnd-col dnd-mini ${c.id===cur.id?'active':''}" data-route="${c.id}" data-mini="1"><b>${c.id==='pool'?'Offen':c.name.replace('Tour ','')}</b><span>${n}</span></div>`; }).join('')}</div>`;
    document.querySelectorAll('.dnd-mini').forEach(m => m.addEventListener('click', e => { ui.planCol = e.currentTarget.dataset.route; render(); window.scrollTo(0,0); }));

}
let dnd = null, dndJustDropped = false;
function initBoardDnD(animalId){
  document.querySelectorAll('.dnd-card').forEach(card => {
    card.addEventListener('pointerdown', e => {
      const onHandle = !!e.target.closest('.dnd-handle');
      if (e.pointerType !== 'mouse' && !onHandle) return; // Touch: nur am Griff ziehen, sonst normal scrollen
      if (e.button !== undefined && e.button !== 0) return;
      dnd = {card, animalId, startX:e.clientX, startY:e.clientY, started:false, pointerId:e.pointerId};
      if (onHandle) { e.preventDefault(); startDnd(e); }
      window.addEventListener('pointermove', onDndMove, {passive:false});
      window.addEventListener('pointerup', onDndEnd);
      window.addEventListener('pointercancel', onDndEnd);
    });
    card.addEventListener('click', e => {
      if (dndJustDropped || e.target.closest('.dnd-handle')) return;
      openModal('route', card.dataset.order);
    });
  });
}
function startDnd(e){
  const r = dnd.card.getBoundingClientRect();
  const ghost = dnd.card.cloneNode(true);
  ghost.classList.add('dnd-ghost'); ghost.style.width = r.width + 'px';
  document.body.appendChild(ghost);
  dnd.ghost = ghost; dnd.offX = e.clientX - r.left; dnd.offY = e.clientY - r.top; dnd.started = true;
  dnd.card.classList.add('dnd-placeholder');
  document.body.classList.add('dnd-active');
  moveGhost(e);
}
function moveGhost(e){ dnd.ghost.style.transform = `translate(${e.clientX - dnd.offX}px, ${e.clientY - dnd.offY}px)`; }
function onDndMove(e){
  if (!dnd) return;
  if (!dnd.started) {
    if (Math.abs(e.clientX-dnd.startX) + Math.abs(e.clientY-dnd.startY) < 6) return;
    startDnd(e);
  }
  e.preventDefault();
  moveGhost(e);
  dnd.ghost.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  dnd.ghost.style.display = '';
  const col = under && under.closest('.dnd-col');
  document.querySelectorAll('.dnd-col').forEach(c => c.classList.toggle('dnd-over', c === col));
  dnd.target = (col && col.dataset.mini) ? col.dataset.route : null;
  if (col && !col.dataset.mini) {
    const list = col.querySelector('.dnd-list');
    const cards = [...list.querySelectorAll('.dnd-card')].filter(c => c !== dnd.card);
    const after = cards.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
    list.insertBefore(dnd.card, after || list.querySelector('.dnd-empty'));
  }
  // Am Bildschirmrand automatisch scrollen
  if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
}
function onDndEnd(){
  window.removeEventListener('pointermove', onDndMove);
  window.removeEventListener('pointerup', onDndEnd);
  window.removeEventListener('pointercancel', onDndEnd);
  if (!dnd) return;
  const d = dnd; dnd = null;
  if (!d.started) return; // war nur ein Klick
  d.ghost.remove(); d.card.classList.remove('dnd-placeholder');
  document.body.classList.remove('dnd-active');
  document.querySelectorAll('.dnd-col').forEach(c => c.classList.remove('dnd-over'));
  const col = d.card.closest('.dnd-col');
  const o = state.orders.find(x => x.id === d.card.dataset.order);
  if (o && d.target) { // auf ein kleines Ablagefeld gezogen
    const routeId = d.target === 'pool' ? null : d.target;
    if (o.route !== routeId) {
      o.route = routeId; o.delivered = false; o.deliveredAt = null;
      if (routeId) { const key = d.animalId + "_" + routeId; state.routeOrder[key] = [...(state.routeOrder[key]||[]).filter(c=>c!==o.customerId), o.customerId]; }
    }
  } else if (col && o) {
    const routeId = col.dataset.route === 'pool' ? null : col.dataset.route;
    if (o.route !== routeId) { o.delivered = false; o.deliveredAt = null; }
    o.route = routeId;
    if (routeId) state.routeOrder[d.animalId + "_" + routeId] = [...col.querySelectorAll('.dnd-card')].map(c => c.dataset.cust);
  }
  dndJustDropped = true; setTimeout(() => dndJustDropped = false, 50);
  commit();
}

function tourStops(animalId, routeId){
  const ords = ordersForAnimal(animalId).filter(o=>o.status===ORDER_STATUS.ORDERED && customerById(o.customerId) && o.route===routeId && !depotHost(o));
  const key = animalId + "_" + routeId;
  let seq = (state.routeOrder[key] || []).filter(cid => ords.some(o=>o.customerId===cid));
  ords.forEach(o => { if (!seq.includes(o.customerId)) seq.push(o.customerId); });
  return seq.map(cid => ords.find(o=>o.customerId===cid));
}

// Zeitplan: Start (Hof, Startzeit) bzw. letzter gelieferter Kunde -> Fahrzeit (OSRM) + 10 Min Abladen pro Kunde
async function computeTourSchedule(animalId, routeId, stops){
  tourEta = {};
  const sumEl = () => document.getElementById('tourSummary');
  try {
    let changed = await ensureHofGeo();
    for (const o of stops) { if (await ensureCustomerGeo(customerById(o.customerId))) changed = true; }
    if (changed) { saveLocalCache(); push(); }
    if (ui.tourRoute !== routeId || ui.tab !== 'routen') return;
    const hof = state.settings.hofGeo;
    if (!hasGeo(hof)) { if (sumEl()) sumEl().textContent = 'Startadresse nicht gefunden - unter "‹ Touren" anpassen.'; return; }
    const geoStops = stops.filter(o => hasGeo(customerById(o.customerId).geo));
    const missing = stops.length - geoStops.length;
    if (geoStops.length === 0) { if (sumEl()) sumEl().textContent = 'Keine Adressen mit Kartenposition - Adressen im Reiter Kunden erfassen.'; return; }
    const legs = await routeLegs([hof, ...geoStops.map(o => customerById(o.customerId).geo)]);
    const key = animalId + "_" + routeId;
    const startStr = state.tourStart[key];
    let t;
    if (startStr) { const [h,m] = startStr.split(':').map(Number); t = new Date(); t.setHours(h, m, 0, 0); } else t = new Date();
    let lastDoneIdx = -1;
    geoStops.forEach((o,i) => { if (o.delivered && o.deliveredAt) lastDoneIdx = i; });
    if (lastDoneIdx >= 0) t = new Date(geoStops[lastDoneIdx].deliveredAt);
    // Mehrere Kunden an derselben Adresse (< 30 m, z.B. jemand verteilt weiter): nur einmal Abladezeit, gleiche Ankunft
    const geoOf = o => customerById(o.customerId).geo;
    const sameLoc = i => i > 0 && distM(geoOf(geoStops[i]), geoOf(geoStops[i-1])) < 30;
    let driveTotal = 0, nextEta = null, endT = null, prevArrival = t, unloadStops = 0;
    geoStops.forEach((o,i) => {
      if (i <= lastDoneIdx) return;
      let arrival, leg = legs[i];
      if (sameLoc(i)) { arrival = prevArrival; leg = 0; }
      else { arrival = new Date(t.getTime() + leg*1000); t = new Date(arrival.getTime() + UNLOAD_MIN*60000); driveTotal += leg; if (!o.delivered) unloadStops++; }
      prevArrival = arrival;
      if (!o.delivered) {
        const etaEl = document.querySelector(`.eta[data-order="${o.id}"]`);
        if (etaEl) etaEl.textContent = '~' + hhmm(arrival) + (sameLoc(i) ? ' (gl. Adr.)' : '');
        tourEta[o.id] = new Date(arrival);
        if (!nextEta) nextEta = {o, t: arrival, drive: leg};
      }
      endT = t;
    });
    if (!sumEl()) return;
    const openCount = geoStops.filter(o=>!o.delivered).length;
    sumEl().textContent = openCount
      ? `${openCount} offene Stopps · Fahrzeit ${Math.round(driveTotal/60)} Min + ${unloadStops*UNLOAD_MIN} Min Abladen · fertig ca. ${hhmm(endT)}${missing?` · ${missing} ohne Kartenposition`:''}`
      : 'Alle Stopps beliefert.';
    const info = document.getElementById('tourNextInfo');
    if (info && nextEta) info.textContent = `Ankunft ca. ${hhmm(nextEta.t)} · ${Math.round(nextEta.drive/60)} Min Fahrt`;
  } catch(e) {
    if (sumEl()) sumEl().textContent = 'Fahrzeiten aktuell nicht verfügbar (offline?).';
  }
}

// Ankunft erkennen: GPS des Handys mit der Position des nächsten Kunden vergleichen
function startArrivalWatch(next){
  const cu = next ? customerById(next.customerId) : null;
  if (!cu || !hasGeo(cu.geo) || !navigator.geolocation) { stopGeoWatch(); return; }
  const update = pos => {
    lastPos = {lat: pos.coords.latitude, lon: pos.coords.longitude};
    const d = distM(lastPos, cu.geo);
    const card = document.getElementById('tourNextCard'), label = document.getElementById('tourNextLabel');
    if (!card || !label) return;
    const arrived = d <= ARRIVE_RADIUS_M;
    card.style.borderColor = arrived ? 'var(--orange)' : '';
    card.style.background = arrived ? '#FFF8EE' : '';
    label.textContent = arrived ? '📍 Angekommen' : `Nächster Halt · noch ${d >= 1000 ? (d/1000).toFixed(1)+' km' : Math.round(d)+' m'}`;
  };
  if (lastPos) update({coords:{latitude:lastPos.lat, longitude:lastPos.lon}});
  stopGeoWatch(); // Ziel kann sich geändert haben -> Beobachtung neu starten
  geoWatchId = navigator.geolocation.watchPosition(update, () => {}, {enableHighAccuracy:true, maximumAge:15000, timeout:20000});
}

});
document.getElementById('saveBox').addEventListener('click', () => { if (!pulling) pull(); });

// Einmaliger Umzug der aktuellen Daten (aus dem Google Sheet / lokalem Cache) zu Firebase
(function initMigrateButton(){
  const btn = document.getElementById('migrateBtn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Migriere…';
    try {
      const res = await fetch(await firebaseDataUrl(), {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state)});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      useFirebase = true;
      localStorage.setItem('hofwerk-use-firebase', '1');
      btn.textContent = '✓ Migriert!';
      setStatus('ok', 'zu Firebase migriert');
      setTimeout(() => { btn.style.display = 'none'; }, 2500);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '✗ Fehlgeschlagen - erneut versuchen';
      alert('Migration fehlgeschlagen: ' + e.message + '\\n\\nPrüfe die Firebase-URL und die Regeln (Reiter "Regeln" muss .read/.write: true enthalten).');
    }
  });
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
